absent_domains:
- domain: clinical
  note: No patient, encounter, visit, lab-result, prescription, care-plan or clinician entity is exposed on any public machine surface.
- domain: membership
  note: Membership plans are sold through human web flows only; no plan or subscription entity is machine-readable.
