aid: parsley-health
name: Parsley Health
description: >-
  Parsley Health is a physician-led virtual and in-person medical practice founded in
  2016 by Dr. Robin Berzin, MD, headquartered at 126 5th Ave, New York, NY, that
  delivers functional medicine as a membership-based primary and specialty care service.
  Members are matched with board-certified MD, DO, NP or PA clinicians who hold
  additional functional medicine fellowship training through Parsley and the Institute
  for Functional Medicine, and are supported by functional nutrition coaches, an RN care
  manager and a care coordinator. Care programs cover gut and digestive health, hormone
  balance, autoimmune and inflammatory conditions, unexplained symptoms, mental and
  emotional health, heart and metabolic health, longevity, perimenopause and menopause,
  fertility, pregnancy and postpartum, and environmental exposure. The membership bundles
  five medical visits, two nutrition coaching sessions, advanced diagnostic lab testing,
  a personalized care plan, a symptom tracking dashboard and unlimited messaging, priced
  at $150/month or $1,500/year with insurance and $275/month or $2,750/year self-pay.
  Parsley is available nationwide via telehealth with in-person care in New York City and
  Los Angeles, is in network with major commercial insurers including Aetna, Cigna,
  UnitedHealthcare, BlueCross BlueShield, Humana and Centene, and also operates a
  direct-to-consumer supplement store. Parsley Health is a consumer healthcare service
  rather than a developer platform: it publishes no developer portal, no API reference, no
  API keys and no OpenAPI, and its public GitHub organization contains internal
  engineering tooling (Docker images, GitHub Actions, lint configs, an Apollo Router fork)
  rather than any client SDK. It does, however, serve real agent-callable surfaces on its
  supplement store at store.parsleyhealth.com: a live anonymous Universal Commerce
  Protocol MCP endpoint exposing thirteen catalog, cart, checkout and order tools, an
  anonymous Shopify Storefront GraphQL endpoint, an llms.txt and agents.md written for
  agents, and OAuth 2.0 / OpenID Connect discovery documents. Those surfaces are provided
  by the Shopify commerce platform under Parsley Health's own hostname, cover retail
  supplement purchase only, and are governed by a published rule that agents must not
  complete payment without contemporaneous human approval. No clinical data is reachable
  by machine: there is no FHIR endpoint, no patient-access API and no appointment, lab or
  medical-record surface, and the member application at my.parsleyhealth.com remains an
  authenticated single-page app with no documented public API.
