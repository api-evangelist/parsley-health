apis:
- name: Parsley Health Store — UCP / MCP Agent Commerce
  description: >-
    The agent-callable surface of Parsley Health's direct-to-consumer supplement store.
    A live, anonymous Universal Commerce Protocol MCP endpoint exposes thirteen tools for
    catalog search, product lookup, cart construction, checkout and order retrieval, with
    JSON Schema 2020-12 input schemas returned by tools/list. The same host serves an
    anonymous Shopify Storefront GraphQL endpoint, unauthenticated storefront JSON
    endpoints, an llms.txt and agents.md aimed at agents, a UCP merchant profile, and
    OpenID Connect / OAuth 2.0 authorization-server discovery for store customer accounts.
    The surface is platform-provided by Shopify under Parsley Health's own hostname (shop
    id 24996151350) rather than engineered by Parsley Health, and it covers retail
    supplement purchase only — no clinical, member, appointment or lab data is reachable.
    Completing checkout requires contemporaneous human buyer approval per the store's own
    published agent rules.
  humanURL: https://store.parsleyhealth.com
  baseURL: https://store.parsleyhealth.com/api/ucp/mcp
  image: https://cdn-builder.parsleyhealth.com/api/v1/image/assets%2F996895949aaa465aa438b22f75b680b6%2F3ca4c568b1cc4dc7b064ff122217abe6
