note: >-
  MATERIAL CHANGE FROM THE 2026-08-02 PASS. The marketing site and the member application
  still publish nothing — every /.well-known/ path on www.parsleyhealth.com returns a real
  404, and my./app.parsleyhealth.com are SPA catch-alls whose 200s are HTML shells and are
  rejected here as false positives. What the earlier pass missed is a THIRD host:
  store.parsleyhealth.com, the company's Shopify-hosted supplement store, which serves
  REAL discovery documents — an llms.txt, an agents.md, a UCP merchant profile, and OpenID
  Connect / OAuth 2.0 authorization-server metadata. Those documents are saved verbatim
  alongside this index and they are what earns the WellKnown pointer in apis.yml. They are
  platform-provided (Shopify serves them for every store) rather than authored by Parsley
  Health, but they are served under Parsley Health's own hostname and describe Parsley
  Health's own shop (id 24996151350). security.txt is still absent everywhere, so no
  SecurityTxt pointer is emitted.
