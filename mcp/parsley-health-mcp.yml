name: Parsley Health Store — UCP / MCP commerce endpoint
note: >-
  Parsley Health serves a LIVE, anonymous, callable MCP server on its own domain at
  https://store.parsleyhealth.com/api/ucp/mcp. It is the Universal Commerce Protocol
  (UCP) shopping service for the Parsley Health supplement store. PROVENANCE MATTERS
  HERE: this endpoint is PLATFORM-PROVIDED, not engineered by Parsley Health. The store
  runs on Shopify (shop id 24996151350, parsley-health.myshopify.com) and Shopify serves
  UCP/MCP natively for every store on the platform; serverInfo reports
  "universal-commerce" 0.1.0, not a Parsley-authored server. Parsley Health's decision to
  run the store on a platform that ships this surface, under its own hostname, is what
  makes it reachable — but the tools, schemas and semantics below are Shopify's, and are
  identical across Shopify merchants. This endpoint covers the SUPPLEMENT STORE ONLY. It
  exposes NO clinical, member, appointment, lab-result or medical-record data, and there
  is still no public API for the Parsley Health medical practice.
ownership_check: >-
  Confirmed this company's surface, not a sibling's: the UCP discovery document names
  merchant_name "Parsley Health" and merchant_origin "store.parsleyhealth.com"; the
  anonymous Storefront GraphQL query returns shop.name "Parsley Health" and
  primaryDomain "https://store.parsleyhealth.com".
deployment:
  mode: remote
  endpoint: https://store.parsleyhealth.com/api/ucp/mcp
  auth: none
  verified: probed
  note: >-
    Anonymous tools/list and initialize both return HTTP 200 with no credential. There is
    no npm/pypi package and no stdio install path — this is a hosted endpoint only. The
    UCP discovery document additionally advertises the same service at the platform
    hostname https://parsley-health.myshopify.com/api/ucp/mcp; both resolve to the same
    shop. Checkout completion requires contemporaneous human buyer approval per the
    store's published agent rules (robots.txt and llms.txt), and payment credentials are
    handled by the declared payment handlers, not by the MCP tools.
